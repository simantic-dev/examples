# Ethernet: the good and the faulty peer on the same wiring, as two machines running
# YOUR firmware (not shipped). Run from this directory:
#   sim --scenario scenario.yaml --timeout 12
# Change mcu, bus, pins and baud to match your firmware.
machines:
  good:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: host, type: eth-peer, mac: "02:00:00:00:00:99", script: good_arp_udp.py }
  faulty:
    mcu: STM32H753IITX
    elf: firmware.elf
    parts:
      - { name: host, type: eth-peer, mac: "02:00:00:00:00:99", script: faulty_frames.py }
media:
  - { type: eth, connect: [good.ethernet, good.host] }
  - { type: eth, connect: [faulty.ethernet, faulty.host] }
